name: Release mhm

on:
  push:
    branches:
      - main
    paths:
      - mhm
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^VERSION=([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' mhm | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read a semantic VERSION from mhm." >&2
            exit 1
          fi

          bash -n mhm
          chmod +x mhm

          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists. Bump VERSION before changing mhm." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          sha256sum mhm > mhm.sha256

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "mhm $TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            mhm \
            mhm.sha256 \
            --title "mhm $TAG" \
            --generate-notes \
            --latest
